services:
  api:
    build:
      context: .
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
