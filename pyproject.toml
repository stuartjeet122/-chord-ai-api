[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "music-intelligence-api"
version = "0.1.0"
description = "Stateless music theory and rhythm API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.3",
    "pydantic==2.12.4",
    "pydantic-settings==2.11.0",
    "uvicorn[standard]==0.38.0",
]

[project.scripts]
music-api = "music_api.main:run"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/music_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
